name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同分支重复触发时取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.x", "24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # onnxruntime-node / node-llama-cpp 的 postinstall 会下载原生二进制，
        # 网络抖动时重试，避免基础设施问题误判为代码问题
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "::warning::npm ci 第 ${attempt} 次失败，10s 后重试"
            sleep 10
          done
          echo "::error::npm ci 连续 3 次失败"
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package entry exports
        run: npm run verify:entry

  package:
    name: package dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "::warning::npm ci 第 ${attempt} 次失败，10s 后重试"
            sleep 10
          done
          echo "::error::npm ci 连续 3 次失败"
          exit 1

      - name: Build
        run: npm run build

      - name: Verify published files
        run: npm pack --dry-run
